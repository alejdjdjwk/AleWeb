<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flarial Launcher</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    font-family: Arial, Helvetica, sans-serif;
    color: white;
    background:
      radial-gradient(circle at 20% 20%, rgba(0, 210, 255, .25), transparent 30%),
      radial-gradient(circle at 80% 80%, rgba(120, 60, 255, .28), transparent 32%),
      linear-gradient(135deg, #070b18, #101936 55%, #080b16);
    overflow: hidden;
  }
  body::before {
    content: "";
    position: fixed;
    inset: -50%;
    background: repeating-linear-gradient(
      115deg, transparent 0 70px, rgba(255,255,255,.025) 70px 72px
    );
    transform: rotate(8deg);
    pointer-events: none;
  }
  .card {
    width: min(92vw, 520px);
    padding: 42px 34px;
    text-align: center;
    border: 1px solid rgba(255,255,255,.14);
    border-radius: 28px;
    background: rgba(13, 19, 43, .72);
    box-shadow: 0 25px 80px rgba(0,0,0,.45);
    backdrop-filter: blur(16px);
  }
  .logo {
    width: 78px;
    height: 78px;
    margin: 0 auto 20px;
    border-radius: 22px;
    display: grid;
    place-items: center;
    font-size: 34px;
    font-weight: 900;
    background: linear-gradient(135deg, #00d9ff, #6c4cff);
    box-shadow: 0 12px 35px rgba(0, 190, 255, .25);
  }
  h1 { margin: 0 0 10px; font-size: 32px; }
  p { margin: 0 auto 28px; color: #b9c3df; line-height: 1.6; }
  button {
    border: 0;
    border-radius: 14px;
    padding: 15px 30px;
    font-size: 17px;
    font-weight: 800;
    color: white;
    cursor: pointer;
    background: linear-gradient(135deg, #00bfe8, #6850ff);
    box-shadow: 0 12px 30px rgba(52, 116, 255, .28);
    transition: transform .15s, filter .15s;
  }
  button:hover { transform: translateY(-2px); filter: brightness(1.1); }
  button:active { transform: translateY(0); }
  .status { min-height: 22px; margin-top: 18px; font-size: 13px; color: #8fe7ff; }
  .note { margin-top: 22px; font-size: 12px; color: #7f8aa8; }
</style>
</head>
<body>
  <main class="card">
    <div class="logo">F</div>
    <h1>Flarial Launcher</h1>
    <p>Descarga el instalador de Flarial Launcher con un solo clic.</p>
    <button id="downloadBtn">⬇ Descargar</button>
    <div class="status" id="status"></div>
    <div class="note">Archivo: Flarial.Launcher.Installer.exe</div>
  </main>

const fileName = "Flarial.Launcher.Installer.exe";

document.getElementById("downloadBtn").addEventListener("click", () => {
  const binary = atob(fileBase64);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);

  const blob = new Blob([bytes], { type: "application/octet-stream" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = fileName;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
